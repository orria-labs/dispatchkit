<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dispatchkit logo</title>
  <desc id="desc">Minimal abstract dispatch/routing logo for @orria/dispatchkit</desc>

  <defs>
    <linearGradient id="flowGradient" x1="240" y1="360" x2="780" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563FF"/>
      <stop offset="0.55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="kitGradient" x1="694" y1="720" x2="860" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- segmented runtime ring -->
    <path d="M305 253A205 205 0 0 1 423 166" stroke="#0F1F3A" stroke-width="22" stroke-linecap="round"/>
    <path d="M500 164A205 205 0 0 1 582 192" stroke="#0F1F3A" stroke-width="22" stroke-linecap="round"/>
    <path d="M582 528A205 205 0 0 1 500 556" stroke="#0F1F3A" stroke-width="22" stroke-linecap="round"/>
    <path d="M423 554A205 205 0 0 1 305 467" stroke="#0F1F3A" stroke-width="22" stroke-linecap="round"/>
    <circle cx="462" cy="162" r="15" fill="#0F1F3A"/>
    <circle cx="462" cy="560" r="15" fill="#0F1F3A"/>

    <!-- module pixels -->
    <rect x="425" y="277" width="24" height="24" rx="3" fill="#0F1F3A"/>
    <rect x="458" y="248" width="24" height="24" rx="3" fill="#0F1F3A"/>
    <rect x="491" y="277" width="24" height="24" rx="3" fill="#0F1F3A"/>

    <rect x="425" y="438" width="24" height="24" rx="3" fill="#0F1F3A"/>
    <rect x="458" y="467" width="24" height="24" rx="3" fill="#0F1F3A"/>
    <rect x="491" y="438" width="24" height="24" rx="3" fill="#0F1F3A"/>

    <!-- dispatch flow -->
    <circle cx="262" cy="360" r="50" stroke="#2563FF" stroke-width="34"/>
    <path d="M312 360H530" stroke="url(#flowGradient)" stroke-width="34" stroke-linecap="round"/>
    <path d="M530 360C596 360 586 228 654 228H692" stroke="url(#flowGradient)" stroke-width="34" stroke-linecap="round"/>
    <path d="M530 360H724" stroke="url(#flowGradient)" stroke-width="34" stroke-linecap="round"/>
    <path d="M530 360C596 360 586 492 654 492H692" stroke="url(#flowGradient)" stroke-width="34" stroke-linecap="round"/>

    <!-- endpoints -->
    <circle cx="744" cy="228" r="30" fill="#14B8A6"/>
    <circle cx="766" cy="360" r="30" fill="#14B8A6"/>
    <circle cx="744" cy="492" r="30" fill="#7C3AED"/>
  </g>

  <!-- compact wordmark -->
  <text x="512" y="745"
        text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="112"
        font-weight="800"
        letter-spacing="-5">
    <tspan fill="#061633">dispatch</tspan><tspan fill="url(#kitGradient)">kit</tspan>
  </text>
</svg>
